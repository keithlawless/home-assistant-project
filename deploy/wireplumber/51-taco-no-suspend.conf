# Keep audio outputs open. By default PipeWire suspends an idle sink after a
# few seconds, and the HDMI link takes long enough to wake that short sounds
# (Taco's chime) and the first word of speech are lost.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
