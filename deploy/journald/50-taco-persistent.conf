# Keep the journal across reboots. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf (Storage=volatile),
# so a power cut used to wipe days of taco-voice logs that wake tuning relies
# on. This file sorts after it and wins. Installed by deploy/install-system.sh.
[Journal]
Storage=persistent
SystemMaxUse=500M
