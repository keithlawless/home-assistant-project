# "Taco Music": the sink radio (mpv) and Spotify (librespot) play into.
# Its output follows the default sink (the kitchen speaker) until taco-core
# points it at a Bluetooth speaker ("play on Sonos", taco/core/speakers.py)
# by setting target.object on taco_music.out. Taco's voice doesn't use it.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Taco Music"
      capture.props = {
        node.name = "taco_music"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        priority.session = 0   # never chosen as the default sink
        state.restore-props = false
      }
      playback.props = {
        node.name = "taco_music.out"
        node.passive = true
        # taco-core mutes this when music plays only in satellite rooms;
        # WirePlumber mustn't save that and bring it back muted.
        state.restore-props = false
        audio.position = [ FL FR ]
      }
    }
  }
]
