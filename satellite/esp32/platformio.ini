; Taco mic satellite firmware for the Waveshare ESP32-S3-AUDIO-Board.
; Build and flash: pio run -t upload && pio device monitor
[platformio]
src_dir = main

[env:waveshare-s3-audio]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
