# Empty stand-in for tflite-runtime, which openwakeword requires on Linux but
# has no Python 3.12 wheels. Taco runs openWakeWord with its ONNX backend.
[project]
name = "tflite-runtime"
version = "2.14.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tflite_runtime"]
