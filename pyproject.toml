[project]
name = "taco"
version = "0.1.0"
description = "Taco: a kitchen voice assistant and smart display for Raspberry Pi 5"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "webrtcvad-wheels>=2.0.14",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.19",
  "faster-whisper>=1.1",
  "piper-tts>=1.3",
  "tflite-runtime; sys_platform == 'linux'",  # stub, see [tool.uv.sources]
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taco-voice = "taco.voice.main:main"
taco-core = "taco.core.app:main"

[tool.uv.sources]
# openwakeword pulls in tflite-runtime on Linux, which has no Python 3.12 wheels.
# Taco runs openWakeWord with its ONNX backend, so an empty stub satisfies it.
tflite-runtime = { path = "stubs/tflite-runtime" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
